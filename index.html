<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti ❤️</title>

<style>
body{
    margin:0;
    padding:0;
    min-height:100vh;
    background: radial-gradient(circle at center, #2b0000, #000);
    font-family: Arial, sans-serif;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start; /* CAMBIO IMPORTANTE */
    padding-top:70px; /* Esto lo sube visualmente */
}

.contenedor{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:25px;
}

.corazon{
    position:relative;
    width:300px;
    height:300px;
}

.corazon span{
    position:absolute;
    font-size:22px;
    animation:latido 2s infinite;
}

@keyframes latido{
    0%{transform:scale(1);}
    50%{transform:scale(1.3);}
    100%{transform:scale(1);}
}

.emoji-centro{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    font-size:65px;
}

button{
    background:#c40000;
    border:none;
    padding:16px 50px;
    font-size:18px;
    color:white;
    border-radius:50px;
    box-shadow:0 0 25px rgba(255,0,0,0.8);
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
}

button:active{
    transform:scale(0.95);
}

.frase{
    color:#ff6b8a;
    font-size:18px;
    padding:0 20px;
}

/* Posiciones del corazón */
.corazon span:nth-child(1){top:0; left:50%; transform:translateX(-50%);}
.corazon span:nth-child(2){top:25px; left:75%;}
.corazon span:nth-child(3){top:70px; left:90%;}
.corazon span:nth-child(4){top:140px; left:95%;}
.corazon span:nth-child(5){top:200px; left:85%;}
.corazon span:nth-child(6){top:240px; left:70%;}
.corazon span:nth-child(7){top:270px; left:50%; transform:translateX(-50%);}
.corazon span:nth-child(8){top:240px; left:30%;}
.corazon span:nth-child(9){top:200px; left:10%;}
.corazon span:nth-child(10){top:140px; left:0;}
.corazon span:nth-child(11){top:70px; left:10%;}
.corazon span:nth-child(12){top:25px; left:30%;}
</style>
</head>

<body>

<div class="contenedor">

    <div class="corazon">
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>

        <div class="emoji-centro">
            🧸 🌹
        </div>
    </div>

    <button onclick="location.href='carta.html'">
        ABRIR MI CORAZÓN ❤️
    </button>

    <div class="frase">
        Te amaré y cuidaré siempre
    </div>

</div>

</body>
</html>
